services:
  - type: web
    name: grocerypick-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py ensure_admin && python manage.py migrate --noinput && gunicorn groceryproject.wsgi:application
    healthCheckPath: /api/products/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: "Vivek"
      - key: ADMIN_EMAIL
        value: "vivekviv8000@gmail.com"
      - key: ADMIN_PASSWORD
        value: "GroceryPick@2026"
